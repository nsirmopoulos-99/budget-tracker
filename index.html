<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Pacing Tool</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fb;
    padding:30px 15px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:25px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    color:#1f2937;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

.current-view{
    background:#ecfdf5;
    border:1px solid #86efac;
    color:#166534;
    padding:10px;
    border-radius:10px;
    margin-bottom:20px;
    font-weight:bold;
    text-align:center;
}

.section-title{
    font-weight:bold;
    margin-bottom:10px;
    color:#374151;
}

.view-controls{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

input,
select{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

button{
    flex:1;
    border:none;
    border-radius:10px;
    padding:14px;
    cursor:pointer;
    font-weight:bold;
}

.save-btn{
    background:#2563eb;
    color:white;
}

.delete-btn{
    background:#ef4444;
    color:white;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    color:#374151;
}

.metric{
    background:#f9fafb;
    padding:16px;
    border-radius:12px;
    margin-bottom:12px;
}

.metric-title{
    color:#6b7280;
    font-size:14px;
}

.metric-value{
    font-size:28px;
    font-weight:bold;
    margin-top:5px;
}

.progress-container{
    margin-top:20px;
}

.progress-bar{
    width:100%;
    height:18px;
    background:#e5e7eb;
    border-radius:999px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#2563eb;
    transition:.3s;
}

.footer-info{
    margin-top:15px;
    text-align:center;
    color:#6b7280;
}

.autosave{
    text-align:center;
    color:#16a34a;
    margin-top:12px;
    font-size:14px;
}

@media(max-width:600px){

.view-controls,
.buttons{
    flex-direction:column;
}

.metric-value{
    font-size:22px;
}

}
</style>
</head>
<body>

<div class="container">
<div class="card">

<h1>📊 Budget Pacing Tool</h1>
<div class="subtitle">
Save multiple budget views locally
</div>

<div class="current-view" id="currentView">
No View Selected
</div>

<div class="section-title">Saved Views</div>

<div class="view-controls">

<select id="savedViews">
<option value="">Select View</option>
</select>

<input
type="text"
id="viewName"
placeholder="New View Name">

</div>

<div class="buttons">

<button
class="save-btn"
onclick="saveView()">
💾 Save View
</button>

<button
class="delete-btn"
onclick="deleteView()">
🗑 Delete View
</button>

</div>

<div class="input-group">
<label>Total Budget (€)</label>
<input type="number" id="totalBudget" placeholder="1000">
</div>

<div class="input-group">
<label>Meta Spent (€)</label>
<input type="number" id="metaSpent" placeholder="0">
</div>

<div class="input-group">
<label>Google Spent (€)</label>
<input type="number" id="googleSpent" placeholder="0">
</div>

<div class="input-group">
<label>TikTok Spent (€)</label>
<input type="number" id="tiktokSpent" placeholder="0">
</div>

<div class="metric">
<div class="metric-title">Remaining Budget</div>
<div class="metric-value" id="remainingBudget">
€0.00
</div>
</div>

<div class="metric">
<div class="metric-title">Recommended Daily Budget</div>
<div class="metric-value" id="dailyBudget">
€0.00
</div>
</div>

<div class="progress-container">

<div style="margin-bottom:8px;font-weight:bold;">
Budget Consumed
</div>

<div class="progress-bar">
<div
class="progress-fill"
id="progressFill">
</div>
</div>

</div>

<div
class="footer-info"
id="daysRemaining">
Days remaining this month: -
</div>

<div class="autosave" id="autosaveStatus">
</div>

</div>
</div>

<script>

const STORAGE_KEY = "budget_pacing_views";

function getViews(){
    return JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || {};
}

function saveViews(data){
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}

function refreshDropdown(){

    const views = getViews();

    const dropdown =
        document.getElementById("savedViews");

    dropdown.innerHTML =
        '<option value="">Select View</option>';

    Object.keys(views).forEach(name=>{

        const option =
            document.createElement("option");

        option.value = name;
        option.textContent = name;

        dropdown.appendChild(option);

    });

}

function saveView(){

    const name =
        document.getElementById("viewName")
        .value
        .trim();

    if(!name){
        alert("Enter a view name");
        return;
    }

    const views = getViews();

    views[name] = {

        totalBudget:
            document.getElementById("totalBudget").value,

        metaSpent:
            document.getElementById("metaSpent").value,

        googleSpent:
            document.getElementById("googleSpent").value,

        tiktokSpent:
            document.getElementById("tiktokSpent").value

    };

    saveViews(views);

    refreshDropdown();

    document.getElementById("savedViews").value =
        name;

    document.getElementById("viewName").value = "";

    updateCurrentView(name);

    showAutoSave("View saved");

}

function loadView(name){

    const views = getViews();

    if(!views[name]) return;

    document.getElementById("totalBudget").value =
        views[name].totalBudget;

    document.getElementById("metaSpent").value =
        views[name].metaSpent;

    document.getElementById("googleSpent").value =
        views[name].googleSpent;

    document.getElementById("tiktokSpent").value =
        views[name].tiktokSpent;

    updateCurrentView(name);

    calculate();

}

function autoSaveCurrentView(){

    const selected =
        document.getElementById("savedViews")
        .value;

    if(!selected) return;

    const views = getViews();

    views[selected] = {

        totalBudget:
            document.getElementById("totalBudget").value,

        metaSpent:
            document.getElementById("metaSpent").value,

        googleSpent:
            document.getElementById("googleSpent").value,

        tiktokSpent:
            document.getElementById("tiktokSpent").value

    };

    saveViews(views);

    showAutoSave("Auto-saved");

}

function deleteView(){

    const selected =
        document.getElementById("savedViews")
        .value;

    if(!selected){
        alert("Select a view");
        return;
    }

    const views = getViews();

    delete views[selected];

    saveViews(views);

    refreshDropdown();

    document.getElementById("savedViews").value = "";

    updateCurrentView("");

    showAutoSave("View deleted");

}

function updateCurrentView(name){

    const badge =
        document.getElementById("currentView");

    badge.textContent =
        name
        ? "🟢 Current View: " + name
        : "No View Selected";

}

function showAutoSave(text){

    const el =
        document.getElementById("autosaveStatus");

    el.textContent = text;

    clearTimeout(window.autoSaveTimer);

    window.autoSaveTimer =
        setTimeout(()=>{
            el.textContent = "";
        },2000);

}

function calculate(){

    const total =
        Number(
            document.getElementById("totalBudget").value
        ) || 0;

    const meta =
        Number(
            document.getElementById("metaSpent").value
        ) || 0;

    const google =
        Number(
            document.getElementById("googleSpent").value
        ) || 0;

    const tiktok =
        Number(
            document.getElementById("tiktokSpent").value
        ) || 0;

    const spent =
        meta + google + tiktok;

    const remaining =
        total - spent;

    const today =
        new Date();

    const daysInMonth =
        new Date(
            today.getFullYear(),
            today.getMonth()+1,
            0
        ).getDate();

    const daysRemaining =
        daysInMonth -
        today.getDate() +
        1;

    const dailyBudget =
        remaining > 0
        ? remaining / daysRemaining
        : 0;

    document.getElementById(
        "remainingBudget"
    ).textContent =
        "€" + remaining.toFixed(2);

    document.getElementById(
        "dailyBudget"
    ).textContent =
        "€" + dailyBudget.toFixed(2);

    document.getElementById(
        "daysRemaining"
    ).textContent =
        "Days remaining this month: "
        + daysRemaining;

    const progress =
        total > 0
        ? (spent / total) * 100
        : 0;

    document.getElementById(
        "progressFill"
    ).style.width =
        Math.min(progress,100) + "%";

}

document
.getElementById("savedViews")
.addEventListener("change",function(){

    loadView(this.value);

});

document
.querySelectorAll("input[type='number']")
.forEach(input=>{

    input.addEventListener("input",()=>{

        calculate();

        autoSaveCurrentView();

    });

});

refreshDropdown();
calculate();

</script>

</body>
</html>
