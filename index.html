<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Pacing Tool</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fb;
    padding:30px 15px;
}

.container{
    max-width:720px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:25px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-bottom:8px;
    color:#1f2937;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:20px;
}

/* CURRENT VIEW */
.current-view{
    background:#ecfdf5;
    border:1px solid #86efac;
    color:#166534;
    padding:10px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    margin-bottom:20px;
}

/* VIEW SELECT */
select{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #d1d5db;
    font-size:16px;
    margin-bottom:15px;
}

/* INPUTS */
.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    color:#374151;
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #d1d5db;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

/* METRICS */
.metric{
    background:#f9fafb;
    padding:16px;
    border-radius:12px;
    margin-top:12px;
}

.metric-title{
    font-size:14px;
    color:#6b7280;
}

.metric-value{
    font-size:26px;
    font-weight:bold;
    margin-top:5px;
}

/* PROGRESS */
.progress-bar{
    height:18px;
    background:#e5e7eb;
    border-radius:999px;
    overflow:hidden;
    margin-top:15px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#2563eb;
    transition:.3s;
}

/* BUTTON */
.delete-btn{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#ef4444;
    color:white;
    font-weight:bold;
    cursor:pointer;
    display:none;
}

.footer{
    margin-top:15px;
    text-align:center;
    color:#6b7280;
}

</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>📊 Budget Pacing Tool</h1>
<div class="subtitle">Auto-save + Multi Views</div>

<div class="current-view" id="currentView">
No Active View
</div>

<!-- VIEW SELECT -->
<select id="viewSelect">
<option value="">➕ Create New View</option>
</select>

<!-- INPUTS -->
<div class="input-group">
<label>Total Budget (€)</label>
<input type="number" id="totalBudget" placeholder="1000">
</div>

<div class="input-group">
<label>Meta Spent (€)</label>
<input type="number" id="metaSpent" placeholder="0">
</div>

<div class="input-group">
<label>Google Spent (€)</label>
<input type="number" id="googleSpent" placeholder="0">
</div>

<div class="input-group">
<label>TikTok Spent (€)</label>
<input type="number" id="tiktokSpent" placeholder="0">
</div>

<!-- METRICS -->
<div class="metric">
<div class="metric-title">Remaining Budget</div>
<div class="metric-value" id="remaining">€0.00</div>
</div>

<div class="metric">
<div class="metric-title">Daily Budget</div>
<div class="metric-value" id="daily">€0.00</div>
</div>

<div class="progress-bar">
<div class="progress-fill" id="progress"></div>
</div>

<div class="footer" id="daysLeft"></div>

<!-- DELETE -->
<button class="delete-btn" id="deleteBtn">
🗑 Delete View
</button>

</div>
</div>

<script>

const KEY = "budget_views_final_v1";
const CURRENT_KEY = "budget_current_view_final_v1";

/* STORAGE */
function getViews(){
    return JSON.parse(localStorage.getItem(KEY)) || {};
}

function saveViews(v){
    localStorage.setItem(KEY, JSON.stringify(v));
}

function setCurrent(v){
    localStorage.setItem(CURRENT_KEY, v);
}

function getCurrent(){
    return localStorage.getItem(CURRENT_KEY);
}

/* UI */
function refreshDropdown(){

    const select = document.getElementById("viewSelect");
    const views = getViews();

    select.innerHTML = `<option value="">➕ Create New View</option>`;

    Object.keys(views).forEach(name=>{
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
    });

    const current = getCurrent();
    if(current) select.value = current;
}

/* LOAD */
function loadView(name){

    const views = getViews();
    if(!views[name]) return;

    document.getElementById("totalBudget").value = views[name].totalBudget || 0;
    document.getElementById("metaSpent").value = views[name].metaSpent || 0;
    document.getElementById("googleSpent").value = views[name].googleSpent || 0;
    document.getElementById("tiktokSpent").value = views[name].tiktokSpent || 0;

    setCurrent(name);

    document.getElementById("currentView").innerText =
        "🟢 Current View: " + name;

    document.getElementById("deleteBtn").style.display = "block";

    calculate();
}

/* CREATE VIEW */
function createView(){

    const name = prompt("Enter View Name:");

    if(!name) return;

    const views = getViews();

    views[name] = {
        totalBudget:0,
        metaSpent:0,
        googleSpent:0,
        tiktokSpent:0
    };

    saveViews(views);

    refreshDropdown();

    loadView(name);
}

/* AUTO SAVE */
function autoSave(){

    const current = getCurrent();
    if(!current) return;

    const views = getViews();

    views[current] = {
        totalBudget: document.getElementById("totalBudget").value || 0,
        metaSpent: document.getElementById("metaSpent").value || 0,
        googleSpent: document.getElementById("googleSpent").value || 0,
        tiktokSpent: document.getElementById("tiktokSpent").value || 0
    };

    saveViews(views);
}

/* DELETE */
function deleteView(){

    const current = getCurrent();
    if(!current) return;

    const views = getViews();
    delete views[current];

    saveViews(views);

    localStorage.removeItem(CURRENT_KEY);

    document.getElementById("currentView").innerText = "No Active View";

    document.getElementById("deleteBtn").style.display = "none";

    refreshDropdown();

    document.getElementById("totalBudget").value = 0;
    document.getElementById("metaSpent").value = 0;
    document.getElementById("googleSpent").value = 0;
    document.getElementById("tiktokSpent").value = 0;

    calculate();
}

/* CALC */
function calculate(){

    const total = Number(document.getElementById("totalBudget").value) || 0;
    const meta = Number(document.getElementById("metaSpent").value) || 0;
    const google = Number(document.getElementById("googleSpent").value) || 0;
    const tiktok = Number(document.getElementById("tiktokSpent").value) || 0;

    const spent = meta + google + tiktok;
    const remaining = total - spent;

    const now = new Date();
    const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1,0).getDate();
    const daysLeft = daysInMonth - now.getDate() + 1;

    const daily = remaining > 0 ? remaining / daysLeft : 0;

    document.getElementById("remaining").innerText = "€" + remaining.toFixed(2);
    document.getElementById("daily").innerText = "€" + daily.toFixed(2);
    document.getElementById("daysLeft").innerText = daysLeft + " days left";

    const progress = total > 0 ? (spent / total) * 100 : 0;
    document.getElementById("progress").style.width = Math.min(progress,100) + "%";
}

/* EVENTS */

/* dropdown */
document.getElementById("viewSelect").addEventListener("change", function(){

    if(this.value === ""){
        createView();
        return;
    }

    loadView(this.value);
});

/* auto save on input */
document.querySelectorAll("input").forEach(i=>{
    i.addEventListener("input", ()=>{
        calculate();
        autoSave();
    });
});

/* INIT */
refreshDropdown();

const last = getCurrent();
if(last){
    loadView(last);
}

calculate();

</script>

</body>
</html>
