<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Pacing Tool</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    padding:30px 15px;
}

.container{
    max-width:800px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:25px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    color:#1f2937;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

.current-view{
    background:#ecfdf5;
    border:1px solid #86efac;
    color:#166534;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    margin-bottom:20px;
}

.controls{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

select{
    flex:1;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
}

button{
    border:none;
    border-radius:10px;
    padding:14px 18px;
    cursor:pointer;
    font-weight:bold;
}

.create-btn{
    background:#2563eb;
    color:white;
}

.delete-btn{
    background:#ef4444;
    color:white;
    display:none;
}

.input-group{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

.metric{
    background:#f9fafb;
    padding:16px;
    border-radius:12px;
    margin-top:12px;
}

.metric-title{
    color:#6b7280;
    font-size:14px;
}

.metric-value{
    font-size:30px;
    font-weight:bold;
    margin-top:4px;
}

.progress-bar{
    height:18px;
    background:#e5e7eb;
    border-radius:999px;
    overflow:hidden;
    margin-top:20px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#2563eb;
    transition:.3s;
}

.footer{
    text-align:center;
    color:#6b7280;
    margin-top:15px;
}

.last-save{
    text-align:center;
    color:#16a34a;
    font-size:13px;
    margin-top:8px;
}

@media(max-width:700px){

.controls{
    flex-direction:column;
}

}
</style>
</head>
<body>

<div class="container">

<div class="card">

<h1>📊 Budget Pacing Tool</h1>
<div class="subtitle">
Auto-save Budget Views
</div>

<div class="current-view" id="currentView">
No Active View
</div>

<div class="controls">

<select id="viewSelect">
<option value="">Select View</option>
</select>

<button
class="create-btn"
id="createBtn">
➕ Create New View
</button>

<button
class="delete-btn"
id="deleteBtn">
🗑 Delete View
</button>

</div>

<div class="input-group">
<label>Total Budget (€)</label>
<input type="number" id="totalBudget" placeholder="1000">
</div>

<div class="input-group">
<label>Meta Spent (€)</label>
<input type="number" id="metaSpent" placeholder="0">
</div>

<div class="input-group">
<label>Google Spent (€)</label>
<input type="number" id="googleSpent" placeholder="0">
</div>

<div class="input-group">
<label>TikTok Spent (€)</label>
<input type="number" id="tiktokSpent" placeholder="0">
</div>

<div class="metric">
<div class="metric-title">Remaining Budget</div>
<div class="metric-value" id="remainingBudget">
€0.00
</div>
</div>

<div class="metric">
<div class="metric-title">Recommended Daily Budget</div>
<div class="metric-value" id="dailyBudget">
€0.00
</div>
</div>

<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>

<div class="footer" id="daysRemaining">
Days Remaining: -
</div>

<div class="last-save" id="lastSave"></div>

</div>

</div>

<script>

const STORAGE_KEY = "budget_tool_views_v3";
const CURRENT_VIEW_KEY = "budget_tool_current_view_v3";

function getViews(){
    return JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || {};
}

function saveViews(data){
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}

function getCurrentView(){
    return localStorage.getItem(
        CURRENT_VIEW_KEY
    );
}

function setCurrentView(name){
    localStorage.setItem(
        CURRENT_VIEW_KEY,
        name
    );
}

function clearCurrentView(){
    localStorage.removeItem(
        CURRENT_VIEW_KEY
    );
}

function refreshDropdown(){

    const select =
        document.getElementById("viewSelect");

    const views =
        getViews();

    select.innerHTML =
        '<option value="">Select View</option>';

    Object.keys(views).forEach(name=>{

        const option =
            document.createElement("option");

        option.value = name;
        option.textContent = name;

        select.appendChild(option);

    });

    const current =
        getCurrentView();

    if(current){
        select.value = current;
    }

}

function updateViewBadge(){

    const current =
        getCurrentView();

    const badge =
        document.getElementById("currentView");

    const deleteBtn =
        document.getElementById("deleteBtn");

    if(current){

        badge.innerHTML =
            "🟢 Current View: <strong>" +
            current +
            "</strong>";

        deleteBtn.style.display =
            "block";

    }else{

        badge.innerText =
            "No Active View";

        deleteBtn.style.display =
            "none";

    }

}

function clearInputs(){

    document.getElementById("totalBudget").value = "";
    document.getElementById("metaSpent").value = "";
    document.getElementById("googleSpent").value = "";
    document.getElementById("tiktokSpent").value = "";

    calculate();

}

function createView(){

    const name =
        prompt("Enter View Name");

    if(!name) return;

    const cleanName =
        name.trim();

    if(!cleanName) return;

    const views =
        getViews();

    if(views[cleanName]){

        alert("View already exists");

        return;
    }

    views[cleanName] = {

        totalBudget:"",
        metaSpent:"",
        googleSpent:"",
        tiktokSpent:""

    };

    saveViews(views);

    setCurrentView(cleanName);

    clearInputs();

    refreshDropdown();

    updateViewBadge();

}

function loadView(name){

    const views =
        getViews();

    if(!views[name]) return;

    const data =
        views[name];

    document.getElementById("totalBudget").value =
        data.totalBudget || "";

    document.getElementById("metaSpent").value =
        data.metaSpent || "";

    document.getElementById("googleSpent").value =
        data.googleSpent || "";

    document.getElementById("tiktokSpent").value =
        data.tiktokSpent || "";

    setCurrentView(name);

    updateViewBadge();

    calculate();

}

function autoSave(){

    const current =
        getCurrentView();

    if(!current) return;

    const views =
        getViews();

    views[current] = {

        totalBudget:
            document.getElementById("totalBudget").value,

        metaSpent:
            document.getElementById("metaSpent").value,

        googleSpent:
            document.getElementById("googleSpent").value,

        tiktokSpent:
            document.getElementById("tiktokSpent").value

    };

    saveViews(views);

    document.getElementById("lastSave")
        .innerText =
        "Last saved: " +
        new Date().toLocaleTimeString();

}

function deleteView(){

    const current =
        getCurrentView();

    if(!current) return;

    if(!confirm(
        "Delete view '" +
        current +
        "' ?"
    )) return;

    const views =
        getViews();

    delete views[current];

    saveViews(views);

    clearCurrentView();

    refreshDropdown();

    updateViewBadge();

    clearInputs();

}

function calculate(){

    const total =
        Number(
            document.getElementById("totalBudget").value
        ) || 0;

    const meta =
        Number(
            document.getElementById("metaSpent").value
        ) || 0;

    const google =
        Number(
            document.getElementById("googleSpent").value
        ) || 0;

    const tiktok =
        Number(
            document.getElementById("tiktokSpent").value
        ) || 0;

    const spent =
        meta + google + tiktok;

    const remaining =
        total - spent;

    const today =
        new Date();

    const daysInMonth =
        new Date(
            today.getFullYear(),
            today.getMonth()+1,
            0
        ).getDate();

    const daysRemaining =
        daysInMonth -
        today.getDate() +
        1;

    const daily =
        remaining > 0
        ? remaining / daysRemaining
        : 0;

    document.getElementById(
        "remainingBudget"
    ).innerText =
        "€" +
        remaining.toFixed(2);

    document.getElementById(
        "dailyBudget"
    ).innerText =
        "€" +
        daily.toFixed(2);

    document.getElementById(
        "daysRemaining"
    ).innerText =
        "Days Remaining: " +
        daysRemaining;

    const progress =
        total > 0
        ? (spent / total) * 100
        : 0;

    document.getElementById(
        "progressFill"
    ).style.width =
        Math.min(progress,100) + "%";

}

document
.getElementById("createBtn")
.addEventListener(
    "click",
    createView
);

document
.getElementById("deleteBtn")
.addEventListener(
    "click",
    deleteView
);

document
.getElementById("viewSelect")
.addEventListener(
    "change",
    function(){

        if(!this.value) return;

        loadView(this.value);

    }
);

document
.querySelectorAll("input")
.forEach(input=>{

    input.addEventListener(
        "input",
        ()=>{

            calculate();

            autoSave();

        }
    );

});

refreshDropdown();

const lastView =
    getCurrentView();

if(lastView){

    loadView(lastView);

}

updateViewBadge();

calculate();

</script>

</body>
</html>
